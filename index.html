<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreeDesign</title>
    <!-- App instalable (PWA): manifiesto, iconos y ajustes para iPhone/iPad (el service worker se registra en src/pwa.ts) -->
    <meta name="description" content="Taller para diseñar y fabricar prendas: lienzo, 3D, fichas técnicas y producción." />
    <meta name="theme-color" content="#161618" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FreeDesign" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Letras de la app: Space Grotesk (textos) e IBM Plex Mono (etiquetas, medidas, referencias). Se cargan sin
         bloquear el arranque (media=print y al cargar, all): sin conexión a Google Fonts la app arranca igual -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
